<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界面7 经营报表</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { width:1600px; height:900px; overflow:hidden; display:flex; background:#F5F7FA; }
  .side { width:230px; background:#15233B; flex-shrink:0; padding:26px 0; }
  .brand { display:flex; align-items:center; gap:10px; color:#fff; font-size:20px; font-weight:700; padding:0 26px 30px; }
  .brand .mark { width:34px; height:34px; background:#1668D1; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .menu .mi { padding:15px 26px; color:#9FB0C7; font-size:15px; display:flex; align-items:center; gap:12px; }
  .menu .mi.on { background:#1668D1; color:#fff; font-weight:600; }

  .main { flex:1; padding:28px 34px; }
  .head { display:flex; align-items:center; }
  .head h2 { font-size:23px; color:#1F2937; }
  .head .f { margin-left:auto; display:flex; gap:12px; }
  .fbox { background:#fff; border:1.5px solid #E5E7EB; border-radius:8px; padding:10px 16px; font-size:14px; color:#6B7280; }

  .stats { display:flex; gap:20px; margin-top:22px; }
  .stat { flex:1; background:#fff; border-radius:12px; padding:22px 24px; box-shadow:0 4px 14px rgba(0,0,0,.04); }
  .stat .l { font-size:14px; color:#9CA3AF; }
  .stat .v { font-size:30px; font-weight:700; color:#1F2937; margin-top:12px; }
  .stat .v small { font-size:15px; font-weight:400; color:#6B7280; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; }

  .charts { display:flex; gap:20px; margin-top:22px; }
  .panel { background:#fff; border-radius:12px; padding:22px 26px; box-shadow:0 4px 14px rgba(0,0,0,.04); }
  .panel h3 { font-size:16px; color:#1F2937; margin-bottom:14px; }
  .line { flex:1.6; }
  .pie { flex:1; }
  .legend { display:flex; gap:18px; font-size:13px; color:#6B7280; margin-top:8px; justify-content:center; }
</style>
</head>
<body>
  <div class="side">
    <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-5 8 5v12h-5v-7H9v7H4z" fill="#fff"/></svg></span>云栖后台</div>
    <div class="menu">
      <div class="mi">工作台</div>
      <div class="mi">订单管理</div>
      <div class="mi">房型库存</div>
      <div class="mi">核销管理</div>
      <div class="mi on">经营报表</div>
      <div class="mi">系统设置</div>
    </div>
  </div>

  <div class="main">
    <div class="head">
      <h2>经营数据报表</h2>
      <div class="f"><div class="fbox">时间范围：近 30 天</div><div class="fbox">门店：仙林校区店</div></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="l">订单总数</div><div class="v">286 <small>单</small></div></div>
      <div class="stat"><div class="l">平均入住率</div><div class="v">78.5<small>%</small></div></div>
      <div class="stat"><div class="l">营业额</div><div class="v">¥96,420</div></div>
      <div class="stat"><div class="l">取消率</div><div class="v">6.2<small>%</small></div></div>
    </div>

    <div class="charts">
      <div class="panel line">
        <h3>营业额趋势</h3>
        <svg width="720" height="280" viewBox="0 0 720 280">
          <line x1="40" y1="240" x2="700" y2="240" stroke="#E5E7EB"/>
          <line x1="40" y1="180" x2="700" y2="180" stroke="#F1F3F5"/>
          <line x1="40" y1="120" x2="700" y2="120" stroke="#F1F3F5"/>
          <line x1="40" y1="60" x2="700" y2="60" stroke="#F1F3F5"/>
          <path d="M40 210 L150 180 L260 195 L370 140 L480 155 L590 95 L700 70" fill="none" stroke="#1668D1" stroke-width="3"/>
          <path d="M40 210 L150 180 L260 195 L370 140 L480 155 L590 95 L700 70 L700 240 L40 240 Z" fill="#1668D1" opacity=".08"/>
          <g fill="#1668D1"><circle cx="40" cy="210" r="4"/><circle cx="150" cy="180" r="4"/><circle cx="260" cy="195" r="4"/><circle cx="370" cy="140" r="4"/><circle cx="480" cy="155" r="4"/><circle cx="590" cy="95" r="4"/><circle cx="700" cy="70" r="4"/></g>
          <g fill="#9CA3AF" font-size="12"><text x="30" y="262">第1周</text><text x="140" y="262">第2周</text><text x="250" y="262">第3周</text><text x="360" y="262">第4周</text><text x="470" y="262">第5周</text><text x="580" y="262">第6周</text></g>
        </svg>
      </div>

      <div class="panel pie">
        <h3>房型订单占比</h3>
        <svg width="280" height="220" viewBox="0 0 200 200">
          <path d="M100 100 L100 20 A80 80 0 0 1 172 140 Z" fill="#1668D1"/>
          <path d="M100 100 L172 140 A80 80 0 0 1 60 172 Z" fill="#3E8BE6"/>
          <path d="M100 100 L60 172 A80 80 0 0 1 28 60 Z" fill="#7FB0EE"/>
          <path d="M100 100 L28 60 A80 80 0 0 1 100 20 Z" fill="#B9D4F7"/>
        </svg>
        <div class="legend"><span><i class="dot" style="background:#1668D1"></i>大床房 40%</span><span><i class="dot" style="background:#3E8BE6"></i>双床房 30%</span></div>
        <div class="legend"><span><i class="dot" style="background:#7FB0EE"></i>套房 18%</span><span><i class="dot" style="background:#B9D4F7"></i>单人房 12%</span></div>
      </div>
    </div>
  </div>
</body>
</html>
