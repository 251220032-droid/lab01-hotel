<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界面1 登录注册</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { width:1600px; height:900px; overflow:hidden; }
  .page { display:flex; width:1600px; height:900px; background:#F5F7FA; }

  /* 左侧品牌区 */
  .brand { width:760px; background:linear-gradient(150deg,#1668D1 0%,#0E4FA8 100%); position:relative; color:#fff; padding:70px 64px; display:flex; flex-direction:column; }
  .brand .logo { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; }
  .brand .logo .mark { width:42px; height:42px; background:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .brand h1 { font-size:52px; margin-top:120px; letter-spacing:2px; }
  .brand p { font-size:20px; margin-top:22px; line-height:1.7; opacity:.92; }
  .brand .illus { position:absolute; right:50px; bottom:60px; opacity:.95; }

  /* 右侧登录卡 */
  .login { flex:1; display:flex; align-items:center; justify-content:center; }
  .card { width:480px; background:#fff; border-radius:14px; box-shadow:0 12px 40px rgba(17,42,85,.10); padding:46px 44px; }
  .card h2 { font-size:28px; color:#1F2937; }
  .roles { display:flex; gap:10px; margin:26px 0 8px; }
  .role { flex:1; text-align:center; padding:11px 0; border:1.5px solid #E5E7EB; border-radius:9px; font-size:15px; color:#6B7280; cursor:pointer; }
  .role.active { border-color:#1668D1; color:#1668D1; background:#EAF2FE; font-weight:600; }
  .field { margin-top:22px; }
  .field label { display:block; font-size:14px; color:#374151; margin-bottom:8px; }
  .input { width:100%; height:48px; border:1.5px solid #E5E7EB; border-radius:9px; padding:0 16px; font-size:15px; color:#1F2937; }
  .input::placeholder { color:#9CA3AF; }
  .err { color:#E23B3B; font-size:13px; margin-top:8px; visibility:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-size:14px; color:#6B7280; }
  .row a { color:#1668D1; text-decoration:none; }
  .btn { width:100%; height:50px; background:#1668D1; color:#fff; border:none; border-radius:9px; font-size:17px; font-weight:600; margin-top:26px; cursor:pointer; }
  .reg { text-align:center; margin-top:22px; font-size:14px; color:#6B7280; }
  .reg a { color:#1668D1; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="logo">
      <span class="mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-5 8 5v12h-5v-7H9v7H4z" fill="#1668D1"/></svg>
      </span>
      云栖酒店
    </div>
    <h1>欢迎回来</h1>
    <p>欢迎使用云栖酒店预订系统<br>精选好房，开启您的舒适旅程</p>
    <div class="illus">
      <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
        <rect x="20" y="60" width="260" height="120" rx="10" fill="rgba(255,255,255,.12)"/>
        <rect x="45" y="90" width="50" height="60" rx="6" fill="rgba(255,255,255,.25)"/>
        <rect x="125" y="90" width="50" height="60" rx="6" fill="rgba(255,255,255,.25)"/>
        <rect x="205" y="90" width="50" height="60" rx="6" fill="rgba(255,255,255,.25)"/>
      </svg>
    </div>
  </div>

  <div class="login">
    <div class="card">
      <h2>账号登录</h2>
      <div class="roles">
        <div class="role active">顾客</div>
        <div class="role">前台服务人员</div>
        <div class="role">平台管理员</div>
      </div>
      <div class="field">
        <label>用户名 / 手机号</label>
        <input class="input" placeholder="请输入用户名或手机号">
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" placeholder="请输入密码">
      </div>
      <div class="err">用户名或密码错误，请重新输入</div>
      <div class="row">
        <span>记住我</span>
        <a href="#">忘记密码？</a>
      </div>
      <button class="btn">登 录</button>
      <div class="reg">还没有账号？<a href="#">立即注册</a></div>
    </div>
  </div>
</div>
</body>
</html>
