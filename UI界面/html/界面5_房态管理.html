<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界面5 房态库存管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { width:1600px; height:900px; overflow:hidden; display:flex; background:#F5F7FA; }
  .side { width:230px; background:#15233B; flex-shrink:0; padding:26px 0; }
  .brand { display:flex; align-items:center; gap:10px; color:#fff; font-size:20px; font-weight:700; padding:0 26px 30px; }
  .brand .mark { width:34px; height:34px; background:#1668D1; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .menu .mi { padding:15px 26px; color:#9FB0C7; font-size:15px; display:flex; align-items:center; gap:12px; }
  .menu .mi.on { background:#1668D1; color:#fff; font-weight:600; }

  .main { flex:1; padding:28px 34px; }
  .head { display:flex; align-items:center; }
  .head h2 { font-size:23px; color:#1F2937; }
  .head .acts { margin-left:auto; display:flex; gap:12px; }
  .btn { padding:11px 22px; border-radius:8px; font-size:14px; font-weight:600; border:none; }
  .primary { background:#1668D1; color:#fff; }
  .ghost { background:#fff; color:#6B7280; border:1.5px solid #E5E7EB; }

  .filter { display:flex; gap:14px; margin:22px 0; }
  .fbox { background:#fff; border:1.5px solid #E5E7EB; border-radius:8px; padding:10px 16px; font-size:14px; color:#6B7280; min-width:150px; }

  .card { background:#fff; border-radius:12px; padding:8px 24px 20px; box-shadow:0 4px 14px rgba(0,0,0,.04); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:13px; color:#9CA3AF; font-weight:600; padding:16px 12px; border-bottom:1px solid #EEF1F5; }
  td { font-size:14px; color:#374151; padding:16px 12px; border-bottom:1px solid #F3F5F8; }
  .switch { width:46px; height:25px; border-radius:13px; background:#1668D1; position:relative; }
  .switch.off { background:#CBD5E1; }
  .switch i { position:absolute; top:3px; width:19px; height:19px; border-radius:50%; background:#fff; }
  .switch i { right:3px; }
  .switch.off i { left:3px; }
  .st { font-size:13px; padding:4px 12px; border-radius:16px; }
  .st.on { color:#16A34A; background:#E7F6EC; }
  .st.stop { color:#DC2626; background:#FCEBEB; }
  .op a { color:#1668D1; font-size:14px; text-decoration:none; margin-right:16px; }
  .pager { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .pg { width:36px; height:36px; border-radius:8px; background:#fff; border:1.5px solid #E5E7EB; display:flex; align-items:center; justify-content:center; font-size:14px; color:#6B7280; }
  .pg.on { background:#1668D1; color:#fff; border-color:#1668D1; }
</style>
</head>
<body>
  <div class="side">
    <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-5 8 5v12h-5v-7H9v7H4z" fill="#fff"/></svg></span>云栖后台</div>
    <div class="menu">
      <div class="mi">工作台</div>
      <div class="mi">订单管理</div>
      <div class="mi on">房型库存</div>
      <div class="mi">核销管理</div>
      <div class="mi">经营报表</div>
      <div class="mi">系统设置</div>
    </div>
  </div>

  <div class="main">
    <div class="head">
      <h2>房态库存管理</h2>
      <div class="acts"><button class="btn ghost">批量导入</button><button class="btn primary">新增房型</button></div>
    </div>
    <div class="filter">
      <div class="fbox">房型：全部</div>
      <div class="fbox">日期：2026-11-20</div>
      <div class="fbox">状态：全部</div>
    </div>
    <div class="card">
      <table>
        <colgroup><col style="width:20%"><col style="width:15%"><col style="width:13%"><col style="width:14%"><col style="width:16%"><col style="width:22%"></colgroup>
        <tr><th>房型</th><th>日期</th><th>库存数量</th><th>每日价格</th><th>在售状态</th><th>操作</th></tr>
        <tr><td>高级大床房</td><td>2026-11-20</td><td>3</td><td>¥328</td><td><span class="st on">在售</span></td><td class="op"><a href="#">编辑</a><a href="#">停售</a></td></tr>
        <tr><td>豪华双床房</td><td>2026-11-20</td><td>5</td><td>¥368</td><td><span class="st on">在售</span></td><td class="op"><a href="#">编辑</a><a href="#">停售</a></td></tr>
        <tr><td>商务行政套房</td><td>2026-11-20</td><td>1</td><td>¥588</td><td><span class="st on">在售</span></td><td class="op"><a href="#">编辑</a><a href="#">停售</a></td></tr>
        <tr><td>经济单人房</td><td>2026-11-20</td><td>0</td><td>¥218</td><td><span class="st stop">停售</span></td><td class="op"><a href="#">编辑</a><a href="#">恢复</a></td></tr>
        <tr><td>高级大床房</td><td>2026-11-21</td><td>3</td><td>¥338</td><td><span class="st on">在售</span></td><td class="op"><a href="#">编辑</a><a href="#">停售</a></td></tr>
      </table>
      <div class="pager"><div class="pg">‹</div><div class="pg on">1</div><div class="pg">2</div><div class="pg">3</div><div class="pg">›</div></div>
    </div>
  </div>
</body>
</html>
